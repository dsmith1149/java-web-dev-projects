<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org/">
<head th:fragment="head">
   <meta charset="UTF-8"/>
   <title>Coding Events</title>
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<nav th:fragment="header" class="navbar navbar-expand-lg navbar-light bg-light">
   <div class="container-fluid">
      <a class="navbar-brand" href="#">Coding Events</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
         <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
         <ul class="navbar-nav">
            <li class="nav-item">
               <a class="nav-link" href="/events">All Events</a>
            </li>
            <li class="nav-item">
               <a class="nav-link" href="/events/create">Create Event</a>
            </li>
            <li class="nav-item">
               <a class="nav-link" href="/events/delete">Delete Event</a>
            </li>
         </ul>
      </div>
   </div>
</nav>

<!-- Description fragment -->
<td th:fragment="description(descriptionText)" th:text="${descriptionText}">Default Description</td>

<!-- Address fragment -->
<td th:fragment="address"></td>

</body>
</html>
